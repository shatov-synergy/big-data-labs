services:
  rstudio:
    build: .
    container_name: rstudio-bigdata
    environment:
      USER: ${RSTUDIO_USER:-rstudio}
      PASSWORD: ${RSTUDIO_PASSWORD:-bigdata}
      # RStudio 2026.09 не стартует сессию без этого каталога в окружении.
      R_DOC_DIR: /usr/local/lib/R/doc
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      # весь репозиторий монтируется в контейнер:
      # скрипты и результаты лабораторных сразу попадают в git
      - ./:/home/rstudio/project
    working_dir: /home/rstudio/project
    shm_size: 1gb
